name: Auto Commit

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set Git identity
        run: |
          git config --global user.name "phaler99"
          git config --global user.email "phaler99@gmail.com"

      - name: commitment
        run: |
          count=$((RANDOM % 15 + 1))
          echo "🔁 Committing $count times..."

          for i in $(seq 1 $count); do
            echo "Commit $i at $(date)" >> log.txt
            git add log.txt

            if git diff --cached --quiet; then
              echo "No changes to commit at step $i, skipping."
            else
              git commit -m "Update log entry $i"
            fi

            sleep $((RANDOM % 180 + 30))
          done

      - name: Push all commits with PAT
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
          git push origin HEAD
